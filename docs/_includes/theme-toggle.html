{%- comment -%}
  Theme control. One button cycling System → Light → Dark → System; the icon
  and the accessible name both describe the *current* mode. site.js keeps
  data-mode in sync, and CSS shows exactly one of the three blocks.
{%- endcomment -%}
<div class="theme" data-mode="system">
  <button type="button" data-theme-btn>
    <span data-icon="system">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span class="sr-only"><span lang="en">Theme: match my system</span><span lang="uk">Тема: як у системі</span></span>
    </span>
    <span data-icon="light">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
      <span class="sr-only"><span lang="en">Theme: light</span><span lang="uk">Тема: світла</span></span>
    </span>
    <span data-icon="dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span class="sr-only"><span lang="en">Theme: dark</span><span lang="uk">Тема: темна</span></span>
    </span>
  </button>
</div>
