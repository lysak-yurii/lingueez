title: Lingueez
description: Lingueez — legal documents

# Pages is served from /docs. Every page under legal/ uses the shared layout, so the
# Markdown files only need a title + permalink in their front matter.
defaults:
  - scope:
      path: legal
    values:
      layout: legal

# Jekyll skips dot-folders by default; force it to publish the Flathub domain-
# verification file at /.well-known/org.flathub.VerifiedApps.txt.
include:
  - .well-known

# Keep the internal GDPR runbooks, the maintainer README and the translated
# repo READMEs (i18n/ is read on GitHub, not served here) off the public site.
exclude:
  - legal/gdpr
  - legal/README.md
  - i18n
