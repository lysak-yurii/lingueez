: "คัดลอกโฟลเดอร์ <code>lingueez.koplugin</code> ไปไว้ในไดเรกทอรีปลั๊กอินของ KOReader:\n        <ul>\n          <li><b>Android</b> — <code>/sdcard/koreader/plugins/</code></li>\n          <li><b>Linux</b> — <code>~/.config/koreader/plugins/</code></li>\n          <li><b>Kobo / Kindle / เครื่องอื่น</b> — ดูเส้นทางปลั๊กอินได้จากเอกสารของ KOReader</li>\n        </ul>"
