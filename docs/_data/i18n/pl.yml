: Aplikacja Lingueez na Androida przenosi Twoje słownictwo do telefonu — fiszki z powtórkami odstępowymi, quizy i słuchanie bez użycia rąk, wszystko na urządzeniu. Działa offline i synchronizuje się z innymi urządzeniami przez Twoje konto Lingueez.
Lingueez for KOReader — save words from your e-reader: Lingueez dla KOReadera — zapisuj słowa prosto z e-czytnika
? A free, open-source KOReader plugin that saves words straight from your books into your Lingueez vocabulary — translated, language-detected, and synced across your devices.
: Bezpłatna wtyczka do KOReadera o otwartym kodzie, która zapisuje słowa prosto z Twoich książek do słownictwa w Lingueez — przetłumaczone, z rozpoznanym językiem i zsynchronizowane na wszystkich Twoich urządzeniach.
