Now on Android: Android 버전 출시
Take your vocabulary <span class="accent">with you</span>: 나만의 어휘장을 <span class="accent">주머니 속에</span>
? The Lingueez app for Android puts your words in your pocket. Browse and add words, review with flashcards, and listen hands-free with lock-screen playback controls. Sign in to your Lingueez account, and everything stays in sync.
: Android용 Lingueez 앱으로 주머니 속에서 단어를 관리하세요. 단어를 둘러보고 추가하며, 플래시카드로 복습하고, 잠금화면 재생 제어로 핸즈프리 오디오를 감상하세요. Lingueez 계정으로 로그인하면 모든 것이 동기화됩니다.
All platforms: 모든 플랫폼 지원
The same vocabulary, on the move: 이동 중에도 동일한 어휘 학습
Everything you save on your computer or e-reader is already there when you open your phone.: 컴퓨터나 전자책 리더에서 저장한 모든 단어가 휴대폰을 열면 이미 준비되어 있습니다.
Your whole library: 전체 단어 라이브러리
? Organised by language and by status, with favourites, instant search across words and definitions, and bulk import from Excel. Works offline.
: 언어 및 상태별로 정리되며, 즐겨찾기, 단어/정의 실시간 검색, Excel 대량 가져오기를 지원합니다. 오프라인에서도 작동합니다.
Practise anywhere: 언제 어디서나 연습
? Spaced repetition brings each word back just before you would forget it. Swipe to grade, and the ones you found hard come round again.
: 간격 반복 알고리즘이 잊기 직전에 단어를 다시 보여줍니다. 스와이프하여 평가하면 어려운 단어는 다시 반복 학습됩니다.
Multiple choice or type the answer, on whichever deck you pick, asked in either direction — term to translation or back.: 선택한 덱에서 단어→번역 또는 번역→단어 양방향으로 객관식 또는 주관식 답안 입력 학습을 진행하세요.
? Play your words aloud with background playback and lock-screen controls. Read-aloud runs on the device, so it needs no connection.
: 백그라운드 재생 및 잠금화면 제어로 단어를 음성으로 들어보세요. 음성 읽기는 기기 내부에서 실행되므로 인터넷 연결이 필요 없습니다.
