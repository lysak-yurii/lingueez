Lingueez for Android — your vocabulary in your pocket: Lingueez Androidra — a szókincsed a zsebedben
? The Lingueez Android app puts your vocabulary on your phone — spaced-repetition flashcards, quizzes, and hands-free listening that runs on the device. Works offline, and syncs with your other devices through your Lingueez account.
: A Lingueez Android-alkalmazása a telefonodra teszi a szókincsed — szakaszos ismétléses tanulókártyák, kvízek és útközbeni hallgatás, mind magán az eszközön. Offline is működik, és a Lingueez-fiókodon keresztül szinkronizálódik a többi eszközöddel.
Lingueez for KOReader — save words from your e-reader: Lingueez KOReaderhez — ments szavakat az e-könyv-olvasódról
? A free, open-source KOReader plugin that saves words straight from your books into your Lingueez vocabulary — translated, language-detected, and synced across your devices.
: Ingyenes, nyílt forráskódú KOReader-bővítmény, amely a könyveidből egyenesen a Lingueez-szókincsedbe menti a szavakat — lefordítva, felismert nyelvvel és minden eszközöd között szinkronizálva.
