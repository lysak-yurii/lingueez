: Ingyenes, nyílt forráskódú asztali alkalmazás szókincs építéséhez, tanulásához és megjegyzéséhez több nyelven. Vegyél fel szavakat, amelyek maguktól lefordulnak, és nézd, ahogy mindegyik feljut az „Új” állapotból az „Elsajátítva” szintig.
