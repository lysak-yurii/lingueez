? Import articles, web pages, Wikipedia entries and RSS feeds, then read them in the app with synchronized translations and audio — saving any word straight from the texts as you go. AI can also write a short text from the words you are learning right now, so you meet them again in context, in sentences you have not read before.
: लेख, वेब पेज, विकिपीडिया प्रविष्टियाँ और आरएसएस फ़ीड आयात करें, फिर उन्हें ऐप में सिंक्रनाइज़ किए गए अनुवाद और ऑडियो के साथ पढ़ें — पढ़ते समय सीधे पाठों से कोई भी शब्द सहेजें। एआई आपके द्वारा अभी सीखे जा रहे शब्दों से एक छोटा पाठ भी लिख सकता है, ताकि आप उन्हें नए वाक्यों और संदर्भ में फिर से देख सकें।
See your progress over time: समय के साथ अपनी प्रगति देखें
? Monitor vocabulary growth, learning streaks, definition coverage, and mastery levels through a clear and informative dashboard.
: एक स्पष्ट और जानकारीपूर्ण डैशबोर्ड के माध्यम से शब्दावली वृद्धि, सीखने के क्रम (streaks), परिभाषा कवरेज और महारत के स्तरों की निगरानी करें।
Your vocabulary belongs to you: आपकी शब्दावली आपकी अपनी है
? Lingueez is built with a local-first approach. Use it completely offline without creating an account. Cloud synchronization is optional, and your learning data is never tracked or analyzed. Free and open source under the AGPL license.
: Lingueez को लोकल-फर्स्ट दृष्टिकोण के साथ बनाया गया है। बिना खाता बनाए इसे पूरी तरह से ऑफ़लाइन उपयोग करें। क्लाउड सिंक वैकल्पिक है, और आपका सीखने का डेटा कभी भी ट्रैक या विश्लेषित नहीं किया जाता है। AGPL लाइसेंस के तहत मुफ़्त और ओपन सोर्स।
Read the Privacy Policy: गोपनीयता नीति पढ़ें
? Lingueez is free and open-source, with no paywalls. If you enjoy Lingueez and find it useful, a one-off contribution helps cover the servers behind optional cloud sync and supports continued development.
: Lingueez मुफ़्त और ओपन-सोर्स है, जिसमें कोई पेवॉल नहीं है। यदि आप Lingueez का आनंद लेते हैं और इसे उपयोगी पाते हैं, तो एक बार का योगदान वैकल्पिक क्लाउड सिंक के पीछे के सर्वर को कवर करने में मदद करता है और निरंतर विकास का समर्थन करता है।
