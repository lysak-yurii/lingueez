? Long-press any word and tap <b>Save to Lingueez</b>. The plugin detects the book’s language, translates the word, and stores it in your account, ready to study. Adjust the translation before saving if you like.
: किसी भी शब्द को देर तक दबाएं और <b>Lingueez में सहेजें</b> पर टैप करें। प्लगइन पुस्तक की भाषा का पता लगाता है, शब्द का अनुवाद करता है, और अध्ययन के लिए तैयार आपके खाते में सहेजता है। यदि आप चाहें तो सहेजने से पहले अनुवाद समायोजित करें।
