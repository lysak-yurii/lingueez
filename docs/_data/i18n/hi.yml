? Every word you save becomes a flashcard. Build a deck from any filter — status, language or tag — then review it with spaced repetition that brings each word back just before you would have forgotten it.
: आपके द्वारा सहेजा गया प्रत्येक शब्द एक फ़्लैशकार्ड बन जाता है। किसी भी फ़िल्टर — स्थिति, भाषा या टैग — से एक डेक बनाएं, फिर अंतराल दोहराव के साथ उसकी समीक्षा करें जो प्रत्येक शब्द को आपके भूलने से ठीक पहले वापस लाता है।
