Lingueez — build a vocabulary that sticks: Lingueez — словниковий запас, який залишається з вами
? A free, open-source desktop app for building, studying and remembering vocabulary across languages. Add words that translate automatically and watch each one climb from New to Mastered.
: 'Безкоштовний застосунок із відкритим кодом для комп’ютера: поповнюйте, вивчайте та запам’ятовуйте слова різними мовами. Додавайте слова, які перекладаються автоматично, і стежте, як кожне піднімається від «Нове» до «Засвоєно».'
Download Lingueez — Windows, Linux, Android, browser and e-reader: Завантажити Lingueez — Windows, Linux, Android, браузер і е-читач
? Get Lingueez free from the Microsoft Store, Google Play, or as a Windows installer, Linux AppImage or Flatpak. Or read and save words on your KOReader e-reader.
: Отримайте Lingueez безкоштовно в Microsoft Store, Google Play або як інсталятор для Windows, AppImage для Linux чи Flatpak. Або читайте й зберігайте слова просто на е-читачі з KOReader.
Lingueez for Android — your vocabulary in your pocket: Lingueez для Android — ваш словниковий запас у кишені
? The Lingueez Android app puts your vocabulary on your phone — spaced-repetition flashcards, quizzes, and hands-free listening that runs on the device. Works offline, and syncs with your other devices through your Lingueez account.
: 'Застосунок Lingueez для Android переносить ваш словниковий запас у телефон: флешкартки з інтервальними повтореннями, тести й прослуховування на ходу — усе просто на пристрої. Працює офлайн і синхронізується з іншими вашими пристроями через акаунт Lingueez.'
Lingueez for KOReader — save words from your e-reader: Lingueez для KOReader — зберігайте слова просто з е-читача
? A free, open-source KOReader plugin that saves words straight from your books into your Lingueez vocabulary — translated, language-detected, and synced across your devices.
: Безкоштовний плагін із відкритим кодом для KOReader, який зберігає слова просто з ваших книжок до вашого словника Lingueez — з перекладом, визначенням мови та синхронізацією на всіх ваших пристроях.
