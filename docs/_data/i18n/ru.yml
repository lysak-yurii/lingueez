? A free, open-source desktop app for building, studying and remembering vocabulary across languages. Add words that translate automatically and watch each one climb from New to Mastered.
: 'Бесплатное приложение с открытым исходным кодом для компьютера: пополняйте, изучайте и запоминайте слова на разных языках. Добавляйте слова, которые переводятся автоматически, и следите, как каждое поднимается от «Новое» до «Освоено».'
Download Lingueez — Windows, Linux, Android, browser and e-reader: Скачать Lingueez — Windows, Linux, Android, браузер и электронная книга
? Get Lingueez free from the Microsoft Store, Google Play, or as a Windows installer, Linux AppImage or Flatpak. Or read and save words on your KOReader e-reader.
: Получите Lingueez бесплатно в Microsoft Store, Google Play или в виде установщика для Windows, AppImage для Linux либо Flatpak. Или читайте и сохраняйте слова прямо на электронной книге с KOReader.
Lingueez for Android — your vocabulary in your pocket: Lingueez для Android — ваш словарный запас в кармане
? The Lingueez Android app puts your vocabulary on your phone — spaced-repetition flashcards, quizzes, and hands-free listening that runs on the device. Works offline, and syncs with your other devices through your Lingueez account.
: 'Приложение Lingueez для Android переносит ваш словарный запас в телефон: карточки с интервальными повторениями, тесты и прослушивание без рук — всё прямо на устройстве. Работает офлайн и синхронизируется с другими вашими устройствами через аккаунт Lingueez.'
Lingueez for KOReader — save words from your e-reader: Lingueez для KOReader — сохраняйте слова с электронной книги
? A free, open-source KOReader plugin that saves words straight from your books into your Lingueez vocabulary — translated, language-detected, and synced across your devices.
: 'Бесплатный плагин с открытым исходным кодом для KOReader: сохраняет слова прямо из книг в ваш словарь Lingueez — с переводом, определением языка и синхронизацией на всех ваших устройствах.'
