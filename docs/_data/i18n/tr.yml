Lingueez for Android — your vocabulary in your pocket: Android için Lingueez — kelimeleriniz cebinizde
? The Lingueez Android app puts your vocabulary on your phone — spaced-repetition flashcards, quizzes, and hands-free listening that runs on the device. Works offline, and syncs with your other devices through your Lingueez account.
: 'Lingueez’in Android uygulaması kelimelerinizi telefonunuza taşır: aralıklı tekrarlı bilgi kartları, testler ve eller serbest dinleme, hepsi cihaz üzerinde. Çevrimdışı çalışır ve Lingueez hesabınız üzerinden diğer cihazlarınızla eşitlenir.'
Lingueez for KOReader — save words from your e-reader: KOReader için Lingueez — e-okuyucunuzdan kelime kaydedin
? A free, open-source KOReader plugin that saves words straight from your books into your Lingueez vocabulary — translated, language-detected, and synced across your devices.
: 'KOReader için ücretsiz, açık kaynaklı bir eklenti: kelimeleri kitaplarınızdan doğrudan Lingueez kelime dağarcığınıza kaydeder — çevrilmiş, dili algılanmış ve tüm cihazlarınızla eşitlenmiş olarak.'
