No configuration — just copy the plugin and sign in.: Žiadne nastavovanie — len skopírujte doplnok a prihláste sa.
? "Copy the <code>lingueez.koplugin</code> folder into your KOReader plugins directory:\n        <ul>\n          <li><b>Android</b> — <code>/sdcard/koreader/plugins/</code></li>\n          <li><b>Linux</b> — <code>~/.config/koreader/plugins/</code></li>\n          <li><b>Kobo / Kindle / other</b> — see the KOReader documentation for the plugin path.</li>\n        </ul>"
: "Skopírujte priečinok <code>lingueez.koplugin</code> do adresára s doplnkami KOReadera:\n        <ul>\n          <li><b>Android</b> — <code>/sdcard/koreader/plugins/</code></li>\n          <li><b>Linux</b> — <code>~/.config/koreader/plugins/</code></li>\n          <li><b>Kobo / Kindle / ostatné</b> — cestu k doplnkom nájdete v dokumentácii KOReadera.</li>\n        </ul>"
? <b>Restart KOReader.</b> The plugin appears in Plugin Management and adds a <b>Lingueez</b> entry to the menu. Open <b>Menu → Lingueez → Configure</b> and sign in.
: <b>Reštartujte KOReader.</b> Doplnok sa objaví v Plugin Management a do ponuky pridá položku <b>Lingueez</b>. Otvorte <b>Menu → Lingueez → Configure</b> a prihláste sa.
? New to Lingueez? Create your account on the <a href="https://lingueez.app">desktop or web app</a> first — the plugin signs you in, it doesn’t register new accounts.
