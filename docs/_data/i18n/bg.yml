Lingueez — build a vocabulary that sticks: Lingueez — речников запас, който остава
? A free, open-source desktop app for building, studying and remembering vocabulary across languages. Add words that translate automatically and watch each one climb from New to Mastered.
: Безплатно настолно приложение с отворен код за трупане, учене и запомняне на думи на различни езици. Добавяйте думи, които се превеждат сами, и гледайте как всяка се изкачва от „Ново“ до „Овладени“.
Download Lingueez — Windows, Linux, Android, browser and e-reader: Изтеглете Lingueez — Windows, Linux, Android, браузър и електронен четец
? Get Lingueez free from the Microsoft Store, Google Play, or as a Windows installer, Linux AppImage or Flatpak. Or read and save words on your KOReader e-reader.
: Вземете Lingueez безплатно от Microsoft Store, Google Play или като инсталатор за Windows, AppImage за Linux или Flatpak. Или четете и запазвайте думи на електронния си четец с KOReader.
Lingueez for Android — your vocabulary in your pocket: Lingueez за Android — речникът ви в джоба
? The Lingueez Android app puts your vocabulary on your phone — spaced-repetition flashcards, quizzes, and hands-free listening that runs on the device. Works offline, and syncs with your other devices through your Lingueez account.
: Приложението Lingueez за Android слага речника ви в телефона — флаш карти с интервално повторение, тестове и слушане в движение, всичко на самото устройство. Работи офлайн и се синхронизира с другите ви устройства през акаунта ви в Lingueez.
Lingueez for KOReader — save words from your e-reader: Lingueez за KOReader — запазвайте думи от електронния си четец
? A free, open-source KOReader plugin that saves words straight from your books into your Lingueez vocabulary — translated, language-detected, and synced across your devices.
: Безплатна приставка за KOReader с отворен код, която запазва думи направо от книгите ви в речника ви в Lingueez — преведени, с разпознат език и синхронизирани на всичките ви устройства.
