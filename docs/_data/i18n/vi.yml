? Lingueez is built with a local-first approach. Use it completely offline without creating an account. Cloud synchronization is optional, and your learning data is never tracked or analyzed. Free and open source under the AGPL license.
: Lingueez được thiết kế theo định hướng ưu tiên dữ liệu cục bộ (local-first). Sử dụng hoàn toàn ngoại tuyến mà không cần tạo tài khoản. Đồng bộ đám mây là tùy chọn, dữ liệu của bạn không bao giờ bị theo dõi. Miễn phí và mã nguồn mở theo giấy phép AGPL.
