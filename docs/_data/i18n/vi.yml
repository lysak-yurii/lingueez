No configuration — just copy the plugin and sign in.: Không cần cấu hình phức tạp — chỉ cần chép thư mục plugin và đăng nhập.
? "Copy the <code>lingueez.koplugin</code> folder into your KOReader plugins directory:\n        <ul>\n          <li><b>Android</b> — <code>/sdcard/koreader/plugins/</code></li>\n          <li><b>Linux</b> — <code>~/.config/koreader/plugins/</code></li>\n          <li><b>Kobo / Kindle / other</b> — see the KOReader documentation for the plugin path.</li>\n        </ul>"
: "Chép thư mục <code>lingueez.koplugin</code> vào thư mục plugins của KOReader:\n        <ul>\n          <li><b>Android</b> — <code>/sdcard/koreader/plugins/</code></li>\n          <li><b>Linux</b> — <code>~/.config/koreader/plugins/</code></li>\n          <li><b>Kobo / Kindle / thiết bị khác</b> — xem tài liệu KOReader để biết đường dẫn plugin.</li>\n        </ul>"
? <b>Restart KOReader.</b> The plugin appears in Plugin Management and adds a <b>Lingueez</b> entry to the menu. Open <b>Menu → Lingueez → Configure</b> and sign in.
: <b>Khởi động lại KOReader.</b> Plugin sẽ xuất hiện trong Quản lý Plugin và thêm mục <b>Lingueez</b> vào menu. Mở <b>Menu → Lingueez → Cấu hình</b> và đăng nhập.
? New to Lingueez? Create your account on the <a href="https://lingueez.app">desktop or web app</a> first — the plugin signs you in, it doesn’t register new accounts.
: Mới dùng Lingueez? Tạo tài khoản trên <a href="https://lingueez.app">ứng dụng máy tính hoặc web</a> trước — plugin dùng để đăng nhập, không hỗ trợ đăng ký tài khoản mới.
