Lingueez — build a vocabulary that sticks: Lingueez — xây dựng vốn từ vựng ghi nhớ lâu dài
? A free, open-source desktop app for building, studying and remembering vocabulary across languages. Add words that translate automatically and watch each one climb from New to Mastered.
: Ứng dụng máy tính miễn phí, mã nguồn mở để xây dựng, học và ghi nhớ từ vựng ở nhiều ngôn ngữ. Thêm những từ được dịch tự động và theo dõi từng từ đi lên từ “Mới” đến “Đã thành thạo”.
Download Lingueez — Windows, Linux, Android, browser and e-reader: Tải Lingueez — Windows, Linux, Android, trình duyệt và máy đọc sách
? Get Lingueez free from the Snap Store, Microsoft Store, Google Play, or as a Windows installer, Linux AppImage or Flatpak. Or read and save words on your KOReader e-reader.
: Tải Lingueez miễn phí từ Snap Store, Microsoft Store, Google Play, hoặc dưới dạng trình cài đặt Windows, AppImage cho Linux hay Flatpak. Hoặc đọc và lưu từ ngay trên máy đọc sách chạy KOReader.
Lingueez for Android — your vocabulary in your pocket: Lingueez cho Android — vốn từ vựng trong túi bạn
? The Lingueez Android app puts your vocabulary on your phone — spaced-repetition flashcards, quizzes, and hands-free listening that runs on the device. Works offline, and syncs with your other devices through your Lingueez account.
: Ứng dụng Lingueez cho Android đưa vốn từ vựng vào điện thoại của bạn — thẻ ghi nhớ lặp lại ngắt quãng, câu đố và nghe rảnh tay, tất cả chạy ngay trên máy. Hoạt động ngoại tuyến và đồng bộ với các thiết bị khác của bạn qua tài khoản Lingueez.
Lingueez for KOReader — save words from your e-reader: Lingueez cho KOReader — lưu từ ngay từ máy đọc sách
? A free, open-source KOReader plugin that saves words straight from your books into your Lingueez vocabulary — translated, language-detected, and synced across your devices.
: Một plugin KOReader miễn phí, mã nguồn mở giúp lưu từ thẳng từ sách vào vốn từ vựng Lingueez của bạn — đã dịch, đã nhận diện ngôn ngữ và đồng bộ trên mọi thiết bị của bạn.
