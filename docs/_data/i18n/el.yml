Practise with flashcards: Εξάσκηση με κάρτες flashcards
? Every word you save becomes a flashcard. Build a deck from any filter — status, language or tag — then review it with spaced repetition that brings each word back just before you would have forgotten it.
: Κάθε λέξη που αποθηκεύετε γίνεται μια κάρτα flashcard. Δημιουργήστε ένα σετ καρτών από οποιοδήποτε φίλτρο — κατάσταση, γλώσσα ή ετικέτα — και μετά κάντε επανάληψη με διαστήματα, που επαναφέρει κάθε λέξη λίγο πριν την ξεχάσετε.
