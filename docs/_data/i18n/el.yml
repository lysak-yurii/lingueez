Your vocabulary belongs to you: Το λεξιλόγιό σας ανήκει σε εσάς
? Lingueez is built with a local-first approach. Use it completely offline without creating an account. Cloud synchronization is optional, and your learning data is never tracked or analyzed. Free and open source under the AGPL license.
: Το Lingueez είναι κατασκευασμένο με προσέγγιση προτεραιότητας στη τοπική συσκευή (local-first). Χρησιμοποιήστε το πλήρως εκτός σύνδεσης χωρίς δημιουργία λογαριασμού. Ο συγχρονισμός στο cloud είναι προαιρετικός. Δωρεάν και ανοιχτού κώδικα υπό την άδεια AGPL.
Read the Privacy Policy: Διαβάστε την Πολιτική Απορρήτου
? Lingueez is free and open-source, with no paywalls. If you enjoy Lingueez and find it useful, a one-off contribution helps cover the servers behind optional cloud sync and supports continued development.
