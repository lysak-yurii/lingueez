? Import articles, web pages, Wikipedia entries and RSS feeds, then read them in the app with synchronized translations and audio — saving any word straight from the texts as you go. AI can also write a short text from the words you are learning right now, so you meet them again in context, in sentences you have not read before.
: Εισαγάγετε άρθρα, ιστοσελίδες, καταχωρίσεις Wikipedia και ροές RSS, στη συνέχεια διαβάστε τα στην εφαρμογή με συγχρονισμένη μετάφραση και ήχο — αποθηκεύοντας οποιαδήποτε λέξη κατευθείαν από το κείμενο καθώς προχωράτε. Η AI μπορεί επίσης να γράψει ένα μικρό κείμενο από τις λέξεις που μαθαίνετε τώρα, ώστε να τις συναντήσετε ξανά μέσα σε συμφραζόμενα, σε προτάσεις που δεν έχετε ξαναδιαβάσει.
