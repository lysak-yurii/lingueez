# Snap package for Lingueez, targeting Ubuntu's App Center (which lists the Snap
# Store; it does not list Flathub). Build with:  snapcraft
#
# The app tree, launcher, desktop entry, icon and AppStream metadata are installed
# by meson.build at the repo root — the same install the Flatpak uses. Only the
# launcher differs, because the in-sandbox prefix does (/app vs $SNAP/usr).
name: lingueez
base: core24
adopt-info: lingueez        # version/summary/description/license from the metainfo
grade: stable
confinement: strict
# xz over the default-ish lzo: measured on this app, xz packs 373.8 MB vs 478.3 MB
# (-22%) and costs ~1.2s more only on a cold page cache — first launch after install
# or reboot. Warm launches are identical, and the download size is what every
# visitor sees next to the install button.
compression: xz
icon: packaging/flatpak/app.lingueez.Lingueez.png
website: https://lingueez.app
contact: https://github.com/lysak-yurii/lingueez/issues
issues: https://github.com/lysak-yurii/lingueez/issues
platforms:
  amd64:

apps:
  lingueez:
    command: usr/bin/lingueez
    extensions: [gnome]     # Qt/GTK runtime, fonts, themes, portals; also supplies
                            # the desktop, desktop-legacy, gsettings, opengl,
                            # wayland and x11 plugs (x11 is what lets the pynput
                            # hotkey agent grab keys on X11 sessions).
    common-id: app.lingueez.Lingueez
    desktop: usr/share/applications/app.lingueez.Lingueez.desktop
    # The app writes this file into $SNAP_USER_DATA/.config/autostart when the user
    # enables autostart; snapd only honours it if the name matches (see
    # app/system/autostart.py, _APP_NAME).
    autostart: Lingueez.desktop
    plugs:
      - audio-playback              # read-aloud
      - home                        # import/export files the user picks
      - network                     # sync, auth, translation/TTS, RSS, articles
      - network-bind                # the 127.0.0.1:53682 OAuth redirect listener
      - password-manager-service    # keyring for the auth session; NOT auto-connected
      # `home` stops at $HOME, so import/export against a drive under /media (or
      # /mnt) is denied without this. NOT auto-connected either.
      - removable-media

parts:
  # Python dependencies. PySide6 wheels bundle their own Qt, so the runtime comes
  # from pip rather than from the platform snap.
  deps:
    plugin: python
    source: .
    # The full PySide6 wheel, not PySide6-Essentials: app/ui/reader.py imports
    # QtMultimedia at module scope, and that ships in PySide6-Addons. Essentials
    # alone builds and packs fine, then dies at startup with ModuleNotFoundError.
    python-requirements: [requirements.txt]
    # requirements.txt is loose (>=) for development; the snap pins the exact set
    # that was tested, so two builds a week apart ship the same libraries.
    python-constraints: [snap/constraints.txt]
    override-pull: |
      craftctl default
      # The plugin ends with `[ -f setup.py ] || [ -f pyproject.toml ] && pip
      # install .`. Ours only configures ruff, so setuptools falls into flat-layout
      # autodiscovery and aborts on the repo's many top-level directories. Swap in an
      # empty project so that install is a no-op — deleting the file instead would
      # leave that line exiting non-zero, which fails the step under `set -e`.
      cat > pyproject.toml <<'PYPROJECT'
      [build-system]
      requires = ["setuptools"]
      build-backend = "setuptools.build_meta"

      [project]
      name = "lingueez-snap-deps"
      version = "0"

      [tool.setuptools]
      py-modules = []
      PYPROJECT
    build-packages:
      - python3-dev             # evdev (pulled in by pynput) builds from sdist
    override-prime: |
      craftctl default
      # ffmpeg/ffprobe link libblas.so.3 and liblapack.so.3, whose top-level SONAME
      # symlinks are created by update-alternatives on a normal system and so never
      # exist in a snap — only blas/ and lapack/ subdirs get staged. Without them
      # ffprobe dies at load time, and pydub parsing its empty output as JSON is what
      # the user sees as "Failed to save audio: Expecting value: line 1 column 1".
      cd $CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
      ln -sf blas/libblas.so.3 libblas.so.3
      ln -sf lapack/liblapack.so.3 liblapack.so.3
    stage-packages:
      - ffmpeg                  # pydub shells out to it; $SNAP/usr/bin is on PATH
      - libxcb-cursor0          # Qt 6 xcb platform plugin hard-requires it
      # Drop python3-venv if a build shows core24 already provides python3.12.
      - python3-venv

  lingueez:
    after: [deps]
    plugin: meson
    source: .
    meson-parameters: [--prefix=/usr]
    parse-info: [usr/share/metainfo/app.lingueez.Lingueez.metainfo.xml]
    override-build: |
      craftctl default
      # meson installs the Flatpak launcher, which hardcodes /app. Replace it with
      # the snap's prefix and the venv interpreter the deps part staged.
      cat > $CRAFT_PART_INSTALL/usr/bin/lingueez <<'EOF'
      #!/bin/sh
      exec "$SNAP/bin/python3" "$SNAP/usr/lingueez/main.py" "$@"
      EOF
      chmod 755 $CRAFT_PART_INSTALL/usr/bin/lingueez
      # snapd resolves ${SNAP} in Icon=, but not a bare theme name from a snap.
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/app.lingueez.Lingueez.png|' \
        $CRAFT_PART_INSTALL/usr/share/applications/app.lingueez.Lingueez.desktop
