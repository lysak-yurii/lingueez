name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["feature request"]
body:
  - type: dropdown
    id: application
    attributes:
      label: Application
      description: Which Lingueez app is this for?
      multiple: true
      options:
        - Desktop
        - Mobile
        - Web
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
